name: Verifier eval (model)

# Runs a model-based verifier eval against its golden set. It calls the Anthropic API (costs
# money), so it only runs when triggered by hand. The free deterministic/sandbox gates run in CI
# on every push.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which verifier"
        type: choice
        options: [translation, code, data]
        default: translation
      sample:
        description: "Translation only: stratified sample size (empty = all 300 items)"
        required: false
        default: "60"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ inputs.suite }}" in
            translation) npm run eval:translation -- ${{ inputs.sample && format('--sample {0}', inputs.sample) || '' }} ;;
            code) npm run eval:code -- --judge ;;
            data) npm run eval:data -- --judge ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.suite }}-eval
          path: evals/${{ inputs.suite }}/runs/
