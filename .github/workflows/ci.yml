name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Foundry: contract tests, and anvil for the chain package's integration test.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Contract tests (unit, fuzz, invariants)
        run: cd contracts && FOUNDRY_PROFILE=ci forge test
      - name: Generated ABI is up to date
        run: npm run contracts:build && git diff --exit-code packages/chain/src/abi.ts
      - run: npm test

  # The same suite on real Postgres (production runs Postgres; tests default to embedded PGlite).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm test
