[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdesk"
version = "0.1.0"
description = "Python client for the Proof Desk API: conditional payments with verified deliverables, and a Verify API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Proprietary" }
keywords = ["proof desk", "conditional payments", "verification", "agents"]

[tool.setuptools]
packages = ["proofdesk"]
